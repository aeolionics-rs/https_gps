[package]
edition      = "2024"
name         = "https_gps"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "https_gps"
path = "./src/bin/main.rs"

[features]
default = ["esp32s3"]
esp32s3 = [
    "esp-alloc/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-hal/esp32s3",
    "esp-println/esp32s3",
    "esp-radio/esp32s3",
    "esp-rtos/esp32s3",
    "mbedtls-rs/esp32s3",
]

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
critical-section = "1.2.0"
esp-println = { version = "0.18.0" , features = ["log-04"]}
esp-backtrace = { version = "0.20.0", features = ["panic-handler", "println"] }
log = "0.4.34"

esp-alloc = { version = "0.11.0", features = ["esp32s3", "nightly"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.0", features = ["log"] }
heapless = "0.9.3"
embassy-futures = "0.1.2"
mbedtls-rs = { version = "0.3.0", features = ["esp32s3", "log"] }
picoserve = { version = "0.20.1", features = ["embassy", "log"] }
static_cell = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
